<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Five-Color Lotus</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            overflow: hidden;
        }

        .lotus-container {
            width: 90vmin;
            height: 90vmin;
            max-width: 600px;
            max-height: 600px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.1));
        }

        /* Petal styles with gradients */
        .petal {
            stroke: #2a2a2a;
            stroke-width: 1.5;
            transition: all 0.3s ease-in-out;
            transform-origin: center;
            cursor: pointer;
        }

        /* Center petal - Purple */
        .petal-center {
            fill: url(#gradient-purple);
        }

        /* Left top petal - Red */
        .petal-left-top {
            fill: url(#gradient-red);
        }

        /* Right top petal - Blue */
        .petal-right-top {
            fill: url(#gradient-blue);
        }

        /* Left bottom petal - Green */
        .petal-left-bottom {
            fill: url(#gradient-green);
        }

        /* Right bottom petal - Yellow */
        .petal-right-bottom {
            fill: url(#gradient-yellow);
        }

        /* Hover effects for petals */
        .petal:hover {
            opacity: 0.55;
            transform: scale(1.1);
            filter: drop-shadow(0 0 12px currentColor) blur(0.3px);
        }

        /* Double-layer effect using pseudo-element simulation */
        .petal-wrapper {
            position: relative;
        }

        .petal-overlay {
            opacity: 0;
            transform: translate(4px, -4px) scale(1.15);
            filter: blur(2px);
            pointer-events: none;
            transition: all 0.3s ease-in-out;
        }

        .petal-wrapper:hover .petal-overlay {
            opacity: 0.4;
        }

        /* Dots styling */
        .dots {
            fill: #333;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="lotus-container">
        <svg viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg" aria-label="Interactive five-color lotus">
            <defs>
                <!-- Gradient definitions for each petal -->

                <!-- Purple gradient for center petal -->
                <radialGradient id="gradient-purple" cx="50%" cy="50%" r="70%">
                    <stop offset="0%" style="stop-color:#e6d5ff;stop-opacity:1" />
                    <stop offset="50%" style="stop-color:#b896ff;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
                </radialGradient>

                <!-- Red gradient for left top petal -->
                <radialGradient id="gradient-red" cx="50%" cy="50%" r="70%">
                    <stop offset="0%" style="stop-color:#ffd5d5;stop-opacity:1" />
                    <stop offset="50%" style="stop-color:#ff9696;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#ef4444;stop-opacity:1" />
                </radialGradient>

                <!-- Blue gradient for right top petal -->
                <radialGradient id="gradient-blue" cx="50%" cy="50%" r="70%">
                    <stop offset="0%" style="stop-color:#dbeafe;stop-opacity:1" />
                    <stop offset="50%" style="stop-color:#93c5fd;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
                </radialGradient>

                <!-- Green gradient for left bottom petal -->
                <radialGradient id="gradient-green" cx="50%" cy="50%" r="70%">
                    <stop offset="0%" style="stop-color:#d1fae5;stop-opacity:1" />
                    <stop offset="50%" style="stop-color:#86efac;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
                </radialGradient>

                <!-- Yellow gradient for right bottom petal -->
                <radialGradient id="gradient-yellow" cx="50%" cy="50%" r="70%">
                    <stop offset="0%" style="stop-color:#fef3c7;stop-opacity:1" />
                    <stop offset="50%" style="stop-color:#fde68a;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:1" />
                </radialGradient>
            </defs>

            <!-- Top dots (smallest to largest) -->
            <g class="dots-top">
                <circle cx="200" cy="60" r="3" class="dots">
                    <title>Top decoration dot</title>
                </circle>
                <circle cx="200" cy="78" r="5" class="dots">
                    <title>Middle decoration dot</title>
                </circle>
                <circle cx="200" cy="100" r="7" class="dots">
                    <title>Bottom decoration dot</title>
                </circle>
            </g>

            <!-- Lotus petals with overlay for double-layer effect -->

            <!-- Center petal (Purple) -->
            <g class="petal-wrapper">
                <path class="petal petal-overlay petal-center"
                      d="M 200 130 Q 185 180, 190 240 Q 195 260, 200 270 Q 205 260, 210 240 Q 215 180, 200 130 Z">
                </path>
                <path class="petal petal-center"
                      d="M 200 130 Q 185 180, 190 240 Q 195 260, 200 270 Q 205 260, 210 240 Q 215 180, 200 130 Z">
                    <title>Purple petal</title>
                </path>
            </g>

            <!-- Left top petal (Red) -->
            <g class="petal-wrapper">
                <path class="petal petal-overlay petal-left-top"
                      d="M 190 150 Q 140 160, 110 200 Q 100 220, 105 240 Q 120 250, 140 250 Q 170 230, 195 200 Q 195 175, 190 150 Z">
                </path>
                <path class="petal petal-left-top"
                      d="M 190 150 Q 140 160, 110 200 Q 100 220, 105 240 Q 120 250, 140 250 Q 170 230, 195 200 Q 195 175, 190 150 Z">
                    <title>Red petal</title>
                </path>
            </g>

            <!-- Right top petal (Blue) -->
            <g class="petal-wrapper">
                <path class="petal petal-overlay petal-right-top"
                      d="M 210 150 Q 260 160, 290 200 Q 300 220, 295 240 Q 280 250, 260 250 Q 230 230, 205 200 Q 205 175, 210 150 Z">
                </path>
                <path class="petal petal-right-top"
                      d="M 210 150 Q 260 160, 290 200 Q 300 220, 295 240 Q 280 250, 260 250 Q 230 230, 205 200 Q 205 175, 210 150 Z">
                    <title>Blue petal</title>
                </path>
            </g>

            <!-- Left bottom petal (Green) -->
            <g class="petal-wrapper">
                <path class="petal petal-overlay petal-left-bottom"
                      d="M 180 270 Q 150 280, 120 310 Q 105 330, 110 350 Q 125 360, 145 355 Q 165 340, 185 310 Q 190 290, 180 270 Z">
                </path>
                <path class="petal petal-left-bottom"
                      d="M 180 270 Q 150 280, 120 310 Q 105 330, 110 350 Q 125 360, 145 355 Q 165 340, 185 310 Q 190 290, 180 270 Z">
                    <title>Green petal</title>
                </path>
            </g>

            <!-- Right bottom petal (Yellow) -->
            <g class="petal-wrapper">
                <path class="petal petal-overlay petal-right-bottom"
                      d="M 220 270 Q 250 280, 280 310 Q 295 330, 290 350 Q 275 360, 255 355 Q 235 340, 215 310 Q 210 290, 220 270 Z">
                </path>
                <path class="petal petal-right-bottom"
                      d="M 220 270 Q 250 280, 280 310 Q 295 330, 290 350 Q 275 360, 255 355 Q 235 340, 215 310 Q 210 290, 220 270 Z">
                    <title>Yellow petal</title>
                </path>
            </g>

            <!-- Bottom dots (largest to smallest) -->
            <g class="dots-bottom">
                <circle cx="200" cy="390" r="7" class="dots">
                    <title>Top decoration dot</title>
                </circle>
                <circle cx="200" cy="412" r="5" class="dots">
                    <title>Middle decoration dot</title>
                </circle>
                <circle cx="200" cy="430" r="3" class="dots">
                    <title>Bottom decoration dot</title>
                </circle>
            </g>
        </svg>
    </div>
</body>
</html>
