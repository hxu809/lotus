<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Five-Colored Lotus</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #7e8ba3 100%);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        .lotus-container {
            position: relative;
            width: 500px;
            height: 500px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .lotus-center {
            position: absolute;
            width: 80px;
            height: 80px;
            background: radial-gradient(circle, #FFD700, #FFA500);
            border-radius: 50%;
            z-index: 10;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.6);
        }

        .petal {
            position: absolute;
            width: 120px;
            height: 180px;
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            transform-origin: center bottom;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.3));
        }

        .petal::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: inherit;
            background: inherit;
            opacity: 0;
            transform: scale(1);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Five colored petals */
        .petal-red {
            background: linear-gradient(135deg, #ff6b6b, #ee5a6f);
            top: 0;
            left: 50%;
            transform: translateX(-50%) rotate(0deg);
        }

        .petal-yellow {
            background: linear-gradient(135deg, #ffd93d, #f9ca24);
            top: 50%;
            right: 0;
            transform: translate(40%, -50%) rotate(72deg);
        }

        .petal-blue {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            bottom: 30px;
            right: 60px;
            transform: rotate(144deg);
        }

        .petal-green {
            background: linear-gradient(135deg, #43e97b, #38f9d7);
            bottom: 30px;
            left: 60px;
            transform: rotate(216deg);
        }

        .petal-purple {
            background: linear-gradient(135deg, #a8b5ff, #7b68ee);
            top: 50%;
            left: 0;
            transform: translate(-40%, -50%) rotate(288deg);
        }

        /* Hover effects */
        .petal:hover {
            transform: scale(1.3);
            opacity: 0.7;
            z-index: 20;
            filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.5));
        }

        .petal-red:hover {
            transform: translateX(-50%) rotate(0deg) scale(1.3);
        }

        .petal-yellow:hover {
            transform: translate(40%, -50%) rotate(72deg) scale(1.3);
        }

        .petal-blue:hover {
            transform: rotate(144deg) scale(1.3);
        }

        .petal-green:hover {
            transform: rotate(216deg) scale(1.3);
        }

        .petal-purple:hover {
            transform: translate(-40%, -50%) rotate(288deg) scale(1.3);
        }

        /* Double-layer effect on hover */
        .petal:hover::before {
            opacity: 0.5;
            transform: scale(1.15) translate(-5px, -5px);
        }

        /* Gentle floating animation */
        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        .lotus-container {
            animation: float 4s ease-in-out infinite;
        }

        /* Title */
        .title {
            position: absolute;
            top: 50px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            letter-spacing: 3px;
            font-weight: 300;
        }

        /* Water ripples effect */
        .water-ripple {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 150px;
            background: radial-gradient(ellipse at center, rgba(255,255,255,0.1) 0%, transparent 70%);
            animation: ripple 3s ease-in-out infinite;
        }

        @keyframes ripple {
            0%, 100% {
                transform: scale(1);
                opacity: 0.3;
            }
            50% {
                transform: scale(1.1);
                opacity: 0.5;
            }
        }
    </style>
</head>
<body>
    <div class="title">Five-Colored Lotus</div>

    <div class="lotus-container">
        <div class="petal petal-red"></div>
        <div class="petal petal-yellow"></div>
        <div class="petal petal-blue"></div>
        <div class="petal petal-green"></div>
        <div class="petal petal-purple"></div>
        <div class="lotus-center"></div>
    </div>

    <div class="water-ripple"></div>

    <script>
        // Store original state
        let originalState = null;
        let isExpanded = false;

        // Color mapping for each petal
        const petalColors = {
            'petal-red': 'linear-gradient(135deg, #ff6b6b, #ee5a6f)',
            'petal-yellow': 'linear-gradient(135deg, #ffd93d, #f9ca24)',
            'petal-blue': 'linear-gradient(135deg, #4facfe, #00f2fe)',
            'petal-green': 'linear-gradient(135deg, #43e97b, #38f9d7)',
            'petal-purple': 'linear-gradient(135deg, #a8b5ff, #7b68ee)'
        };

        // Add subtle interactive sparkle effect
        document.querySelectorAll('.petal').forEach(petal => {
            petal.addEventListener('mouseenter', function(e) {
                if (!isExpanded) {
                    this.style.transition = 'all 0.4s cubic-bezier(0.4, 0, 0.2, 1)';
                }
            });

            petal.addEventListener('mouseleave', function(e) {
                if (!isExpanded) {
                    this.style.transition = 'all 0.6s cubic-bezier(0.4, 0, 0.2, 1)';
                }
            });

            // Add click event listener
            petal.addEventListener('click', function(e) {
                if (isExpanded) return; // Prevent clicking when already expanded

                // Store original state
                originalState = {
                    background: document.body.style.background || window.getComputedStyle(document.body).background,
                    elements: []
                };

                // Get the color class of the clicked petal
                let colorClass = '';
                for (let className in petalColors) {
                    if (this.classList.contains(className)) {
                        colorClass = className;
                        break;
                    }
                }

                // Change body background to petal color
                if (colorClass) {
                    document.body.style.background = petalColors[colorClass];
                }

                // Hide all elements except the clicked petal
                const allPetals = document.querySelectorAll('.petal');
                const lotusCenter = document.querySelector('.lotus-center');
                const title = document.querySelector('.title');
                const waterRipple = document.querySelector('.water-ripple');

                allPetals.forEach(p => {
                    if (p !== this) {
                        originalState.elements.push({
                            element: p,
                            display: p.style.display,
                            opacity: p.style.opacity
                        });
                        p.style.transition = 'opacity 0.5s ease-out';
                        p.style.opacity = '0';
                        setTimeout(() => { p.style.display = 'none'; }, 500);
                    }
                });

                [lotusCenter, title, waterRipple].forEach(el => {
                    if (el) {
                        originalState.elements.push({
                            element: el,
                            display: el.style.display,
                            opacity: el.style.opacity
                        });
                        el.style.transition = 'opacity 0.5s ease-out';
                        el.style.opacity = '0';
                        setTimeout(() => { el.style.display = 'none'; }, 500);
                    }
                });

                // Expand the clicked petal to fill the screen
                this.style.transition = 'all 0.8s cubic-bezier(0.4, 0, 0.2, 1)';
                this.style.position = 'fixed';
                this.style.top = '50%';
                this.style.left = '50%';
                this.style.transform = 'translate(-50%, -50%) rotate(0deg) scale(8)';
                this.style.width = '120px';
                this.style.height = '180px';
                this.style.zIndex = '1000';
                this.style.opacity = '0.8';

                isExpanded = true;
            });
        });

        // Add ESC key listener to reset
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && isExpanded && originalState) {
                // Restore body background
                document.body.style.background = originalState.background;

                // Restore all hidden elements
                originalState.elements.forEach(item => {
                    item.element.style.transition = 'opacity 0.5s ease-in';
                    item.element.style.display = item.display || '';
                    item.element.style.opacity = item.opacity || '';
                    // Reset to default opacity if it was empty
                    if (item.element.style.opacity === '') {
                        item.element.style.opacity = '1';
                    }
                });

                // Reset the expanded petal
                const expandedPetal = document.querySelector('.petal[style*="position: fixed"]');
                if (expandedPetal) {
                    expandedPetal.style.position = '';
                    expandedPetal.style.top = '';
                    expandedPetal.style.left = '';
                    expandedPetal.style.transform = '';
                    expandedPetal.style.width = '';
                    expandedPetal.style.height = '';
                    expandedPetal.style.zIndex = '';
                    expandedPetal.style.opacity = '';
                    expandedPetal.style.transition = 'all 0.6s cubic-bezier(0.4, 0, 0.2, 1)';
                }

                isExpanded = false;
                originalState = null;
            }
        });
    </script>
</body>
</html>
